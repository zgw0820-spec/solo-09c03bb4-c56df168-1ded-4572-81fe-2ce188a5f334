services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-failover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-failover}
      POSTGRES_DB: ${POSTGRES_DB:-failover}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-failover} -d ${POSTGRES_DB:-failover}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-failover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-failover}
      POSTGRES_DB: ${POSTGRES_DB:-failover}
    ports:
      - "8000:8000"

volumes:
  pgdata:
